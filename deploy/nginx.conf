# Reverse proxy EDR : une seule origine sert le dashboard, l'API et le WebSocket.
# Conséquence : plus de CORS à ouvrir, et les cookies de session HttpOnly
# fonctionnent nativement pour tous les analystes distants.

upstream edr_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Le dashboard n'est pas un site public : on limite la surface exposée.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 25m;

    # ── Dashboard React (SPA) ──────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── WebSocket temps réel ───────────────────────────────────────
    # Deux chemins mènent au même endpoint : /ws pour la console, /api/ws pour
    # tout client qui déduit l'adresse du canal de sa base d'API. Sans le second,
    # une requête d'upgrade tombait dans le bloc /api/ ci-dessous, arrivait en
    # HTTP simple faute d'en-têtes Upgrade, et recevait un 404 déroutant.
    location = /ws {
        proxy_pass http://edr_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une connexion analyste peut rester ouverte longtemps sans trafic :
        # le heartbeat applicatif est à 25 s, on garde une marge confortable.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/ws {
        proxy_pass http://edr_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── API ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://edr_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
