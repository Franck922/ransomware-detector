services:
  # ── PostgreSQL : source de vérité unique et partagée ────────────────
  db:
    image: postgres:16-alpine
    container_name: edr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-edr}
      # Accélère les écritures d'ingestion sans risque pour un lab
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Exposé pour permettre les migrations et l'API lancée hors Docker
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edr} -d ${POSTGRES_DB:-edr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── API FastAPI ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: edr-api
    env_file:
      - .env
    environment:
      # Dans le réseau Compose, la base est joignable par son nom de service
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edr}:${POSTGRES_PASSWORD:-edr_dev_password}@db:5432/${POSTGRES_DB:-edr}
    ports:
      # Publié pour les agents Winlogbeat / PowerShell du lab (VMnet1), qui
      # pointent historiquement vers http://192.168.10.1:8000. La console SOC
      # reste sur 8080 via nginx ; les deux chemins mènent à la même API.
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    # Un seul worker : les extracteurs de features et la baseline sont des
    # automates à état en mémoire, propres à chaque processus. Tout ce que les
    # analystes consultent passe en revanche par PostgreSQL, donc la vue reste
    # cohérente quel que soit le nombre de dashboards connectés.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    restart: unless-stopped

  # ── Reverse proxy : origine unique pour le front, l'API et le WebSocket ──
  # Le dashboard est compilé dans l'image (voir dashboard/Dockerfile) : aucun
  # Node.js requis sur le serveur, et aucun risque de servir un build périmé.
  web:
    build: ./dashboard
    container_name: edr-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
